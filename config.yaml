# Every tunable number in this project lives here. No magic numbers in code.
season: 2026

stats:
  # Earliest season to backfill. sportsdataverse-data's WNBA release assets go
  # back to 2002; historical seasons are immutable once ingested and are
  # skipped on later `update` runs, so pulling the full history costs little.
  history_start_season: 2002
  # Published regular-season game count per team, for the schedule-integrity
  # check. Real schedules can deviate (see DECISIONS.md) — the check reports
  # exact per-team deltas rather than hard-failing on mismatch.
  expected_games_per_team: 44
  # NBA-derived approximation of what fraction of FTA end a possession.
  # POSS = FGA - OREB + TOV + possession_fta_coefficient * FTA. See DECISIONS.md.
  possession_fta_coefficient: 0.44
  # Allowed slack (in minutes) on the team-minutes-per-game check before a
  # team-game is reported as a specific failing row. Box scores round each
  # player's minutes to a whole number, so +/-1-3 minutes of drift per game
  # is normal rounding noise, not a dropped player.
  team_minutes_tolerance: 5

odds:
  # The Odds API sport key for the WNBA.
  sport_key: basketball_wnba
  # Start with one market -- debugging five at once when the join breaks is
  # miserable. Player props are billed per (market x region) on the
  # event-odds endpoint, so this list also drives the credit-cost estimate.
  markets:
    - player_points
  # Bookmaker region(s) to query. "us" covers the major US-facing books.
  regions:
    - us
  # American (integer, e.g. -110/+120) or decimal odds. Pick one and store
  # consistently -- decimal is unambiguous for later de-vigging math, but
  # American is what US books display, so it's easier to sanity-check by eye.
  price_format: american
  # How many snapshots per day the capture cadence targets: line open,
  # midday, ~1hr before tip, and closing (as close to tip as possible). Only
  # used for the monthly credit projection in phase 2; phase 10 is what
  # actually schedules these.
  snapshots_per_day: 4
